version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: kotosensei-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: kotosensei
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
